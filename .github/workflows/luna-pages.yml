name: Deploy LUNA to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'luna-mission-control/**'
      - 'index.html'
      - '.nojekyll'
      - '.github/workflows/luna-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages-luna
  cancel-in-progress: false
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser simulator
        run: |
          node --test luna-mission-control/tests/static-engine.test.mjs
          node --input-type=module --check < luna-mission-control/web/globe.js
          node --test luna-mission-control/tests/horizons-static.test.mjs
          node --test luna-mission-control/tests/lola-terrain.test.mjs
          node --test luna-mission-control/tests/lola-global.test.mjs
          node --test luna-mission-control/tests/lola-polar-detail.test.mjs
          node --test luna-mission-control/tests/engineering-models.test.mjs
          node --test luna-mission-control/tests/launch-window.test.mjs
          node --test luna-mission-control/tests/science-info.test.mjs
          node --check luna-mission-control/web/science-info.mjs
          node --check luna-mission-control/web/launch-window.mjs
          node --test luna-mission-control/tests/rover-screen.test.mjs
          node --test luna-mission-control/tests/science-charts.test.mjs
          node --test luna-mission-control/tests/playback-graphics.test.mjs
          node --check luna-mission-control/web/playback-clock.mjs
          node --test luna-mission-control/tests/terrain-3d.test.mjs
          node --test luna-mission-control/tests/diviner-gcp.test.mjs
          node --test luna-mission-control/tests/horizons-site-validation.test.mjs
          node --input-type=module --check < luna-mission-control/web/app.js
          node --input-type=module --check < luna-mission-control/web/horizons-static.mjs
      - name: Build static website
        run: python3 luna-mission-control/scripts/build_pages.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
