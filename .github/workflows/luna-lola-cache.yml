name: Cache NASA LOLA lunar regional elevation
on:
  push:
    branches: [main]
    paths:
      - 'luna-mission-control/scripts/build_lola_cache.py'
      - '.github/workflows/luna-lola-cache.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: luna-lola-cache
  cancel-in-progress: false
jobs:
  build-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install raster processing dependencies
        run: python -m pip install numpy tifffile
      - name: Download and process NASA LOLA topography
        run: python luna-mission-control/scripts/build_lola_cache.py
      - name: Validate output
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('luna-mission-control/web/assets/lola-south-025deg.json').read_text())
          assert d['schema_version']==1
          assert len(d['elevations_km'])==1440*60
          assert sum(x is None for x in d['elevations_km'])<1000
          print('NASA LOLA regional topography verified')
          PY
      - name: Commit NASA elevation dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add luna-mission-control/web/assets/lola-south-025deg.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Cache NASA LOLA south pole elevation samples'
          git push origin HEAD:main
