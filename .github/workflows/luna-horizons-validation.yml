name: Independently validate LUNA against direct Horizons lunar observers
on:
  push:
    branches: [main]
    paths:
      - 'luna-mission-control/scripts/validate_horizons_sites.py'
      - '.github/workflows/luna-horizons-validation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r luna-mission-control/requirements.txt
      - name: Direct NASA Horizons site-specific comparison
        run: python luna-mission-control/scripts/validate_horizons_sites.py
      - name: Publish reproducible NASA residuals
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add luna-mission-control/web/assets/horizons-direct-check.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish direct NASA Horizons site comparison residuals'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
