name: LUNA scientific tests
on:
  push:
    paths:
      - 'luna-mission-control/**'
      - '.github/workflows/luna-tests.yml'
  pull_request:
    paths:
      - 'luna-mission-control/**'
      - '.github/workflows/luna-tests.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: luna-mission-control
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
