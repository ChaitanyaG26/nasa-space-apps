name: Cache NASA LOLA global elevation
on:
  push:
    branches: [main]
    paths:
      - 'luna-mission-control/scripts/build_lola_global.py'
      - '.github/workflows/luna-lola-global.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nasa-lola-global-cache
  cancel-in-progress: false
jobs:
  cache-global:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy tifffile
      - name: Build NASA LOLA 8 ppd regional horizon grid
        run: python luna-mission-control/scripts/build_lola_global.py
      - name: Validate binary and metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np,json
          p=Path('luna-mission-control/web/assets')
          m=json.loads((p/'lola-global-8ppd.json').read_text())
          z=np.fromfile(p/'lola-global-8ppd.bin',dtype='<i2')
          assert m['width']==2880 and m['height']==1440 and m['pixels_per_degree']==8
          assert z.size==2880*1440
          assert ((z!=-32768).mean())>0.95
          print('Verified NASA LOLA global terrain grid:',z.size,'pixels')
          PY
      - name: Commit global NASA LOLA product
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add luna-mission-control/web/assets/lola-global-8ppd.bin luna-mission-control/web/assets/lola-global-8ppd.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish NASA LOLA whole-Moon elevation grid'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
